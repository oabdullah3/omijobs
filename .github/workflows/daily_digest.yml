name: Daily Dynamic Job Digest

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

jobs:
  run-digest:
    runs-on: ubuntu-latest
    env:
      DB_PATH: ${{ vars.DB_PATH || 'seen_jobs.db' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache SQLite Database
        uses: actions/cache@v4
        with:
          path: ${{ env.DB_PATH }}
          key: jobs-db-${{ env.DB_PATH }}-${{ github.run_id }}
          restore-keys: |
            jobs-db-${{ env.DB_PATH }}-
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          
      - name: Install dependencies and Chrome Headless Shell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          
      - name: Run Autonomous Job Scraper
        timeout-minutes: 30
        env:
          DB_PATH: ${{ env.DB_PATH }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://openrouter.ai/api/v1' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'google/gemini-1.5-flash:free' }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TARGET_EMAIL: ${{ secrets.TARGET_EMAIL }}
          RESUME_TEXT: ${{ secrets.RESUME_TEXT }}
          INSTRUCTIONS_TEXT: ${{ secrets.INSTRUCTIONS_TEXT }}
        run: python run_job_digest.py